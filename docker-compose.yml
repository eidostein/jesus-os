services:
  app:
    build: .
    image: hey-jesus-app
    restart: unless-stopped
    env_file: .env
    environment:
      # Live knowledge is a mounted volume so Knowledge-tab edits survive
      # image rebuilds and `git reset --hard` deploys (decision D7).
      KNOWLEDGE_DIR: /data/knowledge
    volumes:
      - ${KNOWLEDGE_HOST_DIR:-./knowledge}:/data/knowledge
    expose:
      - "8790"
    networks:
      - web
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # bcrypt hash for the /os dashboard (user "jesus") — set in .env.
      OS_DASH_HASH: ${OS_DASH_HASH:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./os:/srv/os:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      - app

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
