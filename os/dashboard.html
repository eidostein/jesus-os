<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hey Jesus — jesus-os Dashboard</title>
<style>
/* ── Design tokens — inherited from segnals-os, re-themed gold for Hey Jesus ── */
:root {
  color-scheme: light;
  --surface-1:#fdfcf9; --page:#f9f8f4;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --grid:#e3e1d7; --axis:#c5c3b5; --border:rgba(11,11,11,.10);
  --series-1:#a87b24; --series-2:#2a78d6;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --success-text:#006300;
  --radius:10px; --r-end:4px;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1:#191713; --page:#0e0d0a;
    --text-primary:#f5efe0; --text-secondary:#c8c3b4; --text-muted:#8d8875;
    --grid:#2c2a22; --axis:#3a3729; --border:rgba(216,169,78,.16);
    --series-1:#d8a94e; --series-2:#5598e7;
    --success-text:#3fbf3f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1:#191713; --page:#0e0d0a;
  --text-primary:#f5efe0; --text-secondary:#c8c3b4; --text-muted:#8d8875;
  --grid:#2c2a22; --axis:#3a3729; --border:rgba(216,169,78,.16);
  --series-1:#d8a94e; --series-2:#5598e7;
  --success-text:#3fbf3f;
}

* { box-sizing:border-box; }
body {
  margin:0; background:var(--page); color:var(--text-primary);
  font-family:var(--font); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap { max-width:1160px; margin:0 auto; padding:28px 20px 72px; }
body.docsmode .wrap { max-width:1460px; }

/* ── Header ───────────────────────────────────────────────────────────────── */
header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
h1 { font-size:21px; margin:0 0 4px; letter-spacing:-.01em; }
h1 .star { color:var(--series-1); }
.sub { color:var(--text-secondary); font-size:13px; margin:0; }
.hbtns { display:flex; gap:8px; }
button.ghost {
  font:inherit; font-size:12px; color:var(--text-secondary);
  background:var(--surface-1); border:1px solid var(--border);
  border-radius:8px; padding:6px 11px; cursor:pointer;
}
button.ghost:hover { color:var(--text-primary); }

/* ── Section scaffolding ──────────────────────────────────────────────────── */
section { margin:0 0 40px; }
.sec-head { display:flex; align-items:baseline; gap:10px; margin:0 0 3px; flex-wrap:wrap; padding-bottom:6px; border-bottom:1px solid var(--border); }
h2 { font-size:15.5px; color:var(--text-primary); margin:0; font-weight:650; letter-spacing:-.01em; }
.sec-note { font-size:12.5px; color:var(--text-muted); margin:6px 0 12px; }
.card {
  background:var(--surface-1); border:1px solid var(--border);
  border-radius:var(--radius); padding:20px;
  box-shadow:0 1px 2px rgba(0,0,0,.03);
  transition:box-shadow .15s ease, border-color .15s ease;
}
.card:hover { box-shadow:0 2px 8px rgba(0,0,0,.05); }
.grid { display:grid; gap:14px; }
.g3 { grid-template-columns:repeat(3,1fr); }
.g5 { grid-template-columns:repeat(5,1fr); }
.g2 { grid-template-columns:1fr 1fr; }
@media (max-width:1000px){ .g5 { grid-template-columns:repeat(2,1fr); } }
@media (max-width:860px){ .g3,.g2 { grid-template-columns:1fr; } }

/* ── Alerts ───────────────────────────────────────────────────────────────── */
.alert { display:flex; gap:12px; padding:14px 16px; border:1px solid var(--border);
  border-left-width:3px; border-radius:8px; background:var(--surface-1); margin-bottom:8px; }
.alert .ico { font-size:15px; line-height:1.3; flex:none; }
.alert h3 { margin:0 0 2px; font-size:14px; }
.alert p { margin:0 0 5px; font-size:13px; color:var(--text-secondary); }
.alert .act { font-size:12px; font-weight:600; }
.a-critical { border-left-color:var(--critical); } .a-critical .act { color:var(--critical); }

/* ── Stat tiles ───────────────────────────────────────────────────────────── */
.tile .lab { font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
.tile .val { font-size:34px; font-weight:650; letter-spacing:-.02em; line-height:1.05; }
.tile .ctx { font-size:12.5px; color:var(--text-secondary); margin-top:7px; }

/* ── Score bar — the game layer ───────────────────────────────────────────── */
.score { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:14px; }
@media (max-width:860px){ .score { grid-template-columns:1fr; } }
.scard { background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; }
.scard .k { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); font-weight:600; }
.scard .v { font-size:31px; font-weight:700; letter-spacing:-.02em; line-height:1.1; margin:6px 0 2px; }
.scard .s { font-size:12.5px; color:var(--text-secondary); }
.outcomes { background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 18px; margin-bottom:14px; }
.outcomes h4 { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted);
  font-weight:600; margin:0 0 10px; }
.outcomes ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
.outcomes li { display:flex; gap:10px; align-items:flex-start; font-size:13.5px; line-height:1.5; }
.outcomes li .pill { flex:0 0 auto; margin-top:1px; font-variant-numeric:tabular-nums; }
#winsMore { margin-top:10px; text-align:center; }

/* ── Tables & pills ───────────────────────────────────────────────────────── */
.stable { width:100%; border-collapse:collapse; font-size:13.5px; }
.stable th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--text-muted); font-weight:600; padding:7px 10px; border-bottom:1px solid var(--border); }
.stable td { padding:9px 10px; border-bottom:1px solid var(--grid); vertical-align:top; }
.stable tr:last-child td { border-bottom:0; }
.stable td.num { font-variant-numeric:tabular-nums; white-space:nowrap; }
.pill { display:inline-block; font-size:11.5px; font-weight:600; padding:2px 9px; border-radius:999px;
  border:1px solid var(--border); background:var(--page); }
.pill.crit { color:var(--critical); border-color:var(--critical); }
.pill.hi { color:var(--serious); border-color:var(--serious); }
.pill.ok { color:var(--success-text); border-color:var(--success-text); }
.pill-btn { font:inherit; font-size:12px; padding:5px 12px; border-radius:99px; cursor:pointer;
  border:1px solid var(--border); background:var(--surface-1); color:var(--text-secondary); }
.who { display:inline-block; min-width:22px; text-align:center; font-size:11px; font-weight:700;
  border-radius:5px; padding:1px 5px; }
.who.M { background:#dbe9fb; color:#1c5cab; } .who.P { background:#ecdcfc; color:#6d28d9; }
.who.C { background:#faecd2; color:#8a5a00; }
footer { margin-top:38px; padding-top:16px; border-top:1px solid var(--grid);
  font-size:12px; color:var(--text-muted); }

/* ── Nav ──────────────────────────────────────────────────────────────────── */
.nav { display:flex; gap:2px; background:var(--surface-1); border:1px solid var(--border);
       border-radius:9px; padding:3px; }
.nav button { font:inherit; font-size:12.5px; font-weight:500; color:var(--text-secondary);
       background:none; border:0; border-radius:6px; padding:6px 14px; cursor:pointer; }
.nav button:hover { color:var(--text-primary); }
.nav button[aria-current="page"] { background:var(--page); color:var(--text-primary);
       box-shadow:0 1px 2px rgba(0,0,0,.06); }

/* ── Knowledge tab ────────────────────────────────────────────────────────── */
.k-grid { display:grid; grid-template-columns:minmax(260px,340px) minmax(0,1fr); gap:14px; align-items:start; }
@media (max-width:900px){ .k-grid { grid-template-columns:1fr; } }
.k-file { display:flex; justify-content:space-between; gap:8px; align-items:baseline;
  padding:9px 10px; border-radius:7px; cursor:pointer; border:1px solid transparent; }
.k-file:hover { background:var(--page); }
.k-file.on { border-color:var(--series-1); background:var(--page); }
.k-file .nm { font-weight:600; font-size:13px; overflow-wrap:anywhere; }
.k-file .mt { font-size:11.5px; color:var(--text-muted); white-space:nowrap; }
.k-name { width:100%; font:inherit; font-size:13px; font-weight:600; padding:8px 10px;
  color:var(--text-primary); background:var(--page); border:1px solid var(--border); border-radius:8px; }
.k-ed { width:100%; min-height:420px; resize:vertical; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:13px; line-height:1.55; padding:12px; color:var(--text-primary); background:var(--page);
  border:1px solid var(--border); border-radius:8px; margin-top:10px; }
.k-ed:focus, .k-name:focus { outline:2px solid var(--series-1); outline-offset:-1px; }
.k-btns { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
.k-btn { font:inherit; font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:8px; cursor:pointer;
  border:1px solid var(--border); background:var(--surface-1); color:var(--text-primary); }
.k-btn.primary { background:var(--series-1); border-color:var(--series-1); color:#1a1508; }
.k-btn.danger { color:var(--critical); border-color:var(--critical); background:none; }
.k-btn:disabled { opacity:.45; cursor:default; }
.k-status { font-size:12.5px; color:var(--success-text); }
.k-status.err { color:var(--critical); }
.k-meter { height:6px; background:var(--grid); border-radius:3px; margin-top:10px; overflow:hidden; }
.k-meter i { display:block; height:100%; background:var(--series-1); border-radius:3px; }
.k-note { font-size:12px; color:var(--text-muted); margin-top:6px; }
.k-intro p { margin:0 0 10px; font-size:13.5px; color:var(--text-secondary); }
.k-intro p:last-child { margin-bottom:0; }
.k-intro strong { color:var(--text-primary); }
.k-intro a { color:var(--series-1); }

/* ── Docs layer (unchanged from segnals-os) ───────────────────────────────── */
.docs { display:grid; grid-template-columns:210px minmax(0,1fr) 176px; gap:40px; align-items:start; }
@media (max-width:1180px){ .docs { grid-template-columns:200px minmax(0,1fr); gap:32px; } .d-toc{ display:none; } }
@media (max-width:760px){ .docs { grid-template-columns:1fr; } .d-side{ position:static !important; } }
.d-side { position:sticky; top:20px; max-height:calc(100vh - 40px); overflow-y:auto; }
.d-search { width:100%; font:inherit; font-size:12.5px; padding:7px 10px; margin-bottom:16px;
       color:var(--text-primary); background:var(--surface-1);
       border:1px solid var(--border); border-radius:8px; }
.d-search::placeholder { color:var(--text-muted); }
.d-cat { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em;
       color:var(--text-muted); margin:18px 0 7px; }
.d-cat:first-child { margin-top:0; }
.win-doc { color:var(--series-1); text-decoration:none; white-space:nowrap; font-weight:550; }
.win-doc:hover { text-decoration:underline; }
.win-doc::before { content:"→ "; }
.d-link { display:block; font-size:13px; color:var(--text-secondary); text-decoration:none;
       padding:5px 10px; border-radius:6px; border-left:2px solid transparent; line-height:1.35; }
.d-link:hover { color:var(--text-primary); background:var(--surface-1); }
.d-link[aria-current="page"] { color:var(--series-1); border-left-color:var(--series-1);
       background:var(--surface-1); font-weight:550; }
.d-main { min-width:0; }
.d-crumb { font-size:12px; color:var(--text-muted); margin-bottom:14px; display:flex;
       gap:7px; align-items:center; flex-wrap:wrap; }
.d-crumb a { color:var(--text-secondary); text-decoration:none; }
.d-crumb a:hover { color:var(--series-1); text-decoration:underline; }
.d-body { font-size:15.5px; line-height:1.7; color:var(--text-primary); max-width:none; }
.d-body h1 { font-size:27px; line-height:1.22; letter-spacing:-.02em; margin:0 0 10px; }
.d-body h1,.d-body h2,.d-body h3 { text-transform:none; letter-spacing:-.01em; color:var(--text-primary); font-weight:650; }
.d-body h2 { font-size:19px; margin:38px 0 12px; padding-bottom:7px;
       border-bottom:1px solid var(--border); letter-spacing:-.01em; scroll-margin-top:24px; }
.d-body h3 { font-size:15.5px; margin:26px 0 8px; scroll-margin-top:24px; }
.d-body p { margin:0 0 14px; }
.d-body ul, .d-body ol { margin:0 0 14px; padding-left:22px; }
.d-body li { margin-bottom:6px; }
.d-body a { color:var(--series-1); }
.d-body code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.87em;
       background:var(--surface-1); border:1px solid var(--border);
       border-radius:4px; padding:1px 5px; }
.d-body hr { border:0; border-top:1px solid var(--border); margin:30px 0; }
.d-body blockquote { margin:0 0 16px; padding:2px 0 2px 16px;
       border-left:3px solid var(--axis); color:var(--text-secondary); }
.d-body blockquote p:last-child { margin-bottom:0; }
.d-tw { overflow-x:auto; margin:0 0 18px; border:1px solid var(--border); border-radius:var(--radius); }
.d-body table { border-collapse:collapse; width:100%; font-size:13.5px; }
.d-body th { text-align:left; font-weight:600; font-size:11.5px; text-transform:uppercase;
       letter-spacing:.05em; color:var(--text-secondary); background:var(--surface-1);
       padding:10px 13px; border-bottom:1px solid var(--border); }
.d-body td { padding:10px 13px; border-bottom:1px solid var(--border); vertical-align:top; }
.d-body tbody tr:last-child td { border-bottom:0; }
.d-cal { color:var(--text-primary); border:1px solid var(--border); border-left-width:3px; border-radius:var(--r-end);
       padding:14px 16px; margin:0 0 18px; background:var(--surface-1); font-size:14px; }
.d-cal p:last-child, .d-cal ul:last-child, .d-cal ol:last-child { margin-bottom:0; }
.d-cal-t { font-weight:650; margin-bottom:7px; }
.cal-good { border-left-color:var(--good); }
.cal-good .d-cal-t { color:var(--success-text); }
.cal-warn { border-left-color:var(--warning); }
.cal-bad  { border-left-color:var(--critical); }
.cal-bad .d-cal-t { color:var(--critical); }
.cal-note { border-left-color:var(--series-1); }
.cal-note .d-cal-t { color:var(--series-1); }
.d-toc { position:sticky; top:20px; font-size:12px; }
.d-toc .k { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em;
       color:var(--text-muted); margin-bottom:9px; }
.d-toc a { display:block; color:var(--text-secondary); text-decoration:none; padding:3px 0 3px 10px;
       border-left:2px solid var(--border); line-height:1.35; }
.d-toc a:hover { color:var(--text-primary); }
.d-toc a.on { color:var(--series-1); border-left-color:var(--series-1); }
.d-toc a.l3 { padding-left:20px; font-size:11.5px; }
.d-meta { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--text-muted);
       border-top:1px solid var(--border); margin-top:34px; padding-top:14px; }
.d-pn { display:flex; gap:12px; margin-top:14px; }
.d-pn a { flex:1; text-decoration:none; border:1px solid var(--border); border-radius:var(--radius);
       padding:11px 14px; background:var(--surface-1); }
.d-pn a:hover { border-color:var(--series-1); }
.d-pn .l { display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
       color:var(--text-muted); margin-bottom:3px; }
.d-pn .t { color:var(--text-primary); font-size:13px; font-weight:550; }
.d-pn .nx { text-align:right; }
.d-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
.d-card { display:block; text-decoration:none; background:var(--surface-1);
       border:1px solid var(--border); border-radius:var(--radius); padding:16px 17px; }
.d-card:hover { border-color:var(--series-1); }
.d-card .t { color:var(--text-primary); font-size:14.5px; font-weight:600; margin-bottom:5px;
       letter-spacing:-.01em; }
.d-card .s { color:var(--text-secondary); font-size:12.5px; line-height:1.5; }
.d-card .m { color:var(--text-muted); font-size:11px; margin-top:9px; }
.d-empty { color:var(--text-muted); font-size:13px; padding:22px 0; }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1><span class="star">✦</span> Hey Jesus — jesus-os</h1>
    <p class="sub" id="subline"></p>
  </div>
  <div class="hbtns">
    <nav class="nav" id="nav">
      <button data-view="dash">Dashboard</button>
      <button data-view="know">Wissen</button>
      <button data-view="docs">Doku</button>
    </nav>
    <button class="ghost" id="lgBtn">EN</button>
    <button class="ghost" id="thBtn">Theme</button>
  </div>
</header>

<div id="view-dash">

<section id="score-sec">
  <div class="sec-head"><h2 data-i18n="h_month"></h2></div>
  <p class="sec-note" data-i18n="n_month"></p>
  <div class="score" id="score"></div>
  <div id="score-results"></div>
  <div id="nextact"></div>
</section>

<section id="alerts-sec">
  <div class="sec-head"><h2 data-i18n="h_alerts"></h2></div>
  <div id="alerts"></div>
</section>

<section>
  <div class="sec-head"><h2 data-i18n="h_numbers"></h2></div>
  <p class="sec-note" data-i18n="n_numbers"></p>
  <div class="grid g5" id="tiles"></div>
</section>

<section>
  <div class="sec-head"><h2 data-i18n="h_short"></h2></div>
  <p class="sec-note" data-i18n="n_short"></p>
  <div class="card"><table class="stable" id="shortPlan"></table></div>
</section>

<section>
  <div class="sec-head"><h2 data-i18n="h_long"></h2></div>
  <div class="card"><table class="stable" id="longPlan"></table></div>
</section>

<section>
  <div class="sec-head"><h2 data-i18n="h_tasks"></h2></div>
  <p class="sec-note" data-i18n="n_tasks"></p>
  <div class="card"><table class="stable" id="tasks"></table></div>
</section>

<section>
  <div class="sec-head"><h2 data-i18n="h_wins"></h2></div>
  <p class="sec-note" data-i18n="n_wins"></p>
  <div class="card"><table class="stable" id="winsBox"></table></div>
  <div id="winsMore"></div>
</section>

<footer id="foot"></footer>

</div><!-- /view-dash -->

<div id="view-know" hidden>
  <section>
    <div class="sec-head"><h2 data-i18n="k_h"></h2></div>
    <p class="sec-note" data-i18n="k_n"></p>
    <div class="card k-intro" id="kIntro"></div>
  </section>
  <section>
    <div class="k-grid">
      <div class="card">
        <div id="kList"></div>
        <div class="k-meter"><i id="kMeter" style="width:0%"></i></div>
        <div class="k-note" id="kBudget"></div>
        <div class="k-btns"><button class="k-btn" id="kNew"></button></div>
      </div>
      <div class="card">
        <input class="k-name" id="kName" spellcheck="false" autocomplete="off">
        <textarea class="k-ed" id="kEd" spellcheck="false"></textarea>
        <div class="k-btns">
          <button class="k-btn primary" id="kSave"></button>
          <button class="k-btn danger" id="kDel"></button>
          <span class="k-status" id="kStatus"></span>
        </div>
        <div class="k-note" id="kHint"></div>
      </div>
    </div>
  </section>
</div><!-- /view-know -->

<div id="view-docs" hidden>
  <div class="docs">
    <aside class="d-side">
      <input class="d-search" id="dSearch" type="search" placeholder="Doku durchsuchen…" autocomplete="off">
      <div id="dNav"></div>
    </aside>
    <main class="d-main">
      <div class="d-crumb" id="dCrumb"></div>
      <article class="d-body" id="dBody"></article>
      <div id="dFoot"></div>
    </main>
    <aside class="d-toc" id="dToc"></aside>
  </div>
</div><!-- /view-docs -->
</div>

<script src="data.js"></script>
<script>
(function(){
const D = window.NL_DATA;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* German first on every load — deliberate: the product itself is German-first
   (decision D2 in docs/DECISIONS.md). The toggle is per-visit only. */
window.OS_LANG = "de";
const isDE = () => window.OS_LANG === "de";
/* Bilingual field picker: uses the *_de variant when present, falls back to English. */
const L = (o, k) => (isDE() && o && o[k + "_de"]) ? o[k + "_de"] : (o ? o[k] : "");

const I18N = {
 de: {

function plans(){

let winsShown = 25;
function winsBox(){
  const th = T("th");

  const page = all.slice(0, winsShown);
  const docLink = w => w.doc
    ? ' <a class="win-doc" href="#/docs/' + encodeURI(w.doc) + '">' + esc(isDE() ? "Doku ansehen" : "read the doc") + '</a>'

      esc(w.area||"") + "</strong></td><td>" + esc(L(w,"text")) + docLink(w) + "</td></tr>").join("");

  $("winsMore").innerHTML = left > 0
    ? '<button class="pill-btn" id="winsMoreBtn">' + T("more_wins") + ' (' + left + ')</button>'

function tasks(){

function foot(){

}

function draw(){ score(); alerts(); tiles(); plans(); winsBox(); tasks(); foot(); }
applyLang(); draw();

<script>
/* ── Knowledge tab: live file manager over /os/api/knowledge ──────────────── */
(function(){
  const $k = id => document.getElementById(id);
  const T = k => window.OS_T(k);
  const API = "/os/api/knowledge";
  let files = [], current = null, isNew = false, maxChars = 200000;

  const fmtDate = iso => iso ? iso.slice(0, 16).replace("T", " ") : "";

  async function refresh(selectName){
    let res;
    try {
      res = await fetch(API, { headers: { "Accept": "application/json" } });
      if (!res.ok) throw new Error(res.status);
    } catch {
      $k("kList").innerHTML = '<div class="d-empty">' + T("k_offline") + '</div>';
      return;
    }
    const data = await res.json();
    files = data.files || [];
    maxChars = data.maxChars || maxChars;
    const used = data.totalChars || 0;
    $k("kMeter").style.width = Math.min(100, used / maxChars * 100) + "%";
    $k("kBudget").textContent = T("k_budget")(used, maxChars);
    renderList();
    if (selectName) {
      const f = files.find(x => x.name === selectName);
      if (f) open(f.name);
    }
  }

  function renderList(){
    $k("kList").innerHTML = files.map(f => `
      <div class="k-file${f.name === current ? " on" : ""}" data-n="${encodeURIComponent(f.name)}">
        <div><div class="nm">${f.name.replace(/[&<>]/g,"")}</div>
        <div class="mt">${f.chars.toLocaleString()}${T("k_chars")} · ${fmtDate(f.mtime)}</div></div>
        <span class="pill ${f.loaded ? "ok" : ""}">${f.loaded ? T("k_active") : T("k_skipped")}</span>
      </div>`).join("");
    $k("kList").querySelectorAll(".k-file").forEach(el => {
      el.onclick = () => open(decodeURIComponent(el.dataset.n));
    });
  }

  async function open(name){
    const res = await fetch(API + "/file?name=" + encodeURIComponent(name));
    if (!res.ok) return;
    current = name; isNew = false;
    $k("kName").value = name;
    $k("kName").readOnly = true;
    $k("kEd").value = await res.text();
    $k("kStatus").textContent = "";
    $k("kDel").disabled = false;
    $k("kSave").disabled = false;
    renderList();
  }

  function fresh(){
    current = null; isNew = true;
    $k("kName").value = "20-";
    $k("kName").readOnly = false;
    $k("kEd").value = "";
    $k("kStatus").textContent = "";
    $k("kDel").disabled = true;
    $k("kSave").disabled = false;
    renderList();
    $k("kName").focus();
  }

  async function save(){
    const name = $k("kName").value.trim();
    const body = $k("kEd").value;
    const st = $k("kStatus");
    st.className = "k-status";
    try {
      const res = await fetch(API + "/file?name=" + encodeURIComponent(name), {
        method: "PUT", headers: { "Content-Type": "text/plain; charset=utf-8" }, body,
      });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
      st.textContent = T("k_saved");
      await refresh(name);
    } catch (e) {
      st.className = "k-status err";
      st.textContent = T("k_err") + e.message;
    }
  }

  async function del(){
    if (!current || !confirm(T("k_confirm"))) return;
    const st = $k("kStatus");
    st.className = "k-status";
    try {
      const res = await fetch(API + "/file?name=" + encodeURIComponent(current), { method: "DELETE" });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.status);
      st.textContent = T("k_deleted");
      current = null;
      $k("kName").value = ""; $k("kEd").value = "";
      $k("kDel").disabled = true;
      await refresh();
    } catch (e) {
      st.className = "k-status err";
      st.textContent = T("k_err") + e.message;
    }
  }

  function applyKnowLang(){
    $k("kIntro").innerHTML = T("k_intro");
    $k("kNew").textContent = T("k_new");
    $k("kSave").textContent = T("k_save");
    $k("kDel").textContent = T("k_del");
    $k("kHint").textContent = T("k_hint");
    if (!current && !isNew) {
      $k("kName").value = ""; $k("kName").readOnly = true;
      $k("kEd").value = ""; $k("kEd").placeholder = T("k_pick");
      $k("kDel").disabled = true; $k("kSave").disabled = true;
    }
  }

  $k("kNew").onclick = fresh;
  $k("kSave").onclick = save;
  $k("kDel").onclick = del;
  addEventListener("langchange", applyKnowLang);
  applyKnowLang();

  let loadedOnce = false;
  window.OS_KNOW_SHOW = () => {
    if (!loadedOnce) { loadedOnce = true; refresh(); }
  };
})();
</script>

  const S = () => de()

       none:"No documents yet. Add markdown in any section folder and rebuild.",
       nomatch:"No match.", onpage:"On this page", forr:"For: ", prev:"← Previous", next:"Next →",
       min:" min", words:" words", en:"English"};

  function groups(list){
    const g = {};
    list.forEach(d => { (g[d.category] = g[d.category] || []).push(d); });
    return g;
  }

  function sidebar(active, filter){
    const q = (filter || "").trim().toLowerCase();
    const list = q

      : DOCS;
    if (!list.length) { $d("dNav").innerHTML = '<div class="d-empty">' + S().nomatch + '</div>'; return; }
    const g = groups(list);
    $d("dNav").innerHTML = Object.keys(g).map(cat =>
      `<div class="d-cat">${esc2(CN(cat))}</div>` +
      g[cat].map(d => `<a class="d-link" href="#/docs/${encodeURI(d.id)}"${
        d.id === active ? ' aria-current="page"' : ""}>${esc2(DT(d))}</a>`).join("")
    ).join("");
  }

  function meta(d){
    return DW(d).toLocaleString() + S().words + " · ~" + Math.max(1, Math.round(DW(d)/220)) + S().min
      + (enOnly(d) ? " · " + S().en : "");
  }

  function index(){
    $d("dCrumb").innerHTML = "";
    $d("dToc").innerHTML = "";
    $d("dFoot").innerHTML = "";
    if (!DOCS.length){
      $d("dBody").innerHTML = "<h1>" + S().docs + '</h1><p class="d-empty">' + S().none + "</p>";
      return;
    }
    const g = groups(DOCS);
    $d("dBody").innerHTML = "<h1>" + S().docs + "</h1><p>" + S().intro + "</p>"
      + Object.keys(g).map(cat => `<h2 id="${cat.toLowerCase()}">${esc2(CN(cat))}</h2>
        <div class="d-cards">${g[cat].map(d => `<a class="d-card" href="#/docs/${encodeURI(d.id)}">
          <div class="t">${esc2(DT(d))}</div>
          <div class="s">${esc2(DS(d))}</div>
          <div class="m">${meta(d)}</div>
        </a>`).join("")}</div>`).join("");
  }

  function reader(id){
    const d = byId[id];
    if (!d) { location.hash = "#/docs"; return; }
    const i = DOCS.indexOf(d), prev = DOCS[i-1], next = DOCS[i+1];

    $d("dCrumb").innerHTML = `<a href="#/docs">${S().docs}</a><span>›</span>`
      + `<a href="#/docs">${esc2(CN(d.category))}</a><span>›</span><span>${esc2(DT(d))}</span>`;
    $d("dBody").innerHTML = DH(d);
    const toc = DTOC(d);
    $d("dToc").innerHTML = toc.length
      ? `<div class="k">${S().onpage}</div>` + toc.map(t =>
          `<a href="#${t.id}" data-h="${t.id}"${t.level===3?' class="l3"':""}>${esc2(t.text)}</a>`).join("")
      : "";
    $d("dFoot").innerHTML =
      `<div class="d-meta"><span>${esc2(CN(d.category))}</span>`
      + (d.audience ? `<span>${S().forr}${esc2(d.audience)}</span>` : "")
      + `<span>${meta(d)}</span>`
      + `<span>${esc2(d.id)}.md</span></div>`
      + `<div class="d-pn">`
      + (prev ? `<a href="#/docs/${encodeURI(prev.id)}"><span class="l">${S().prev}</span>
            <span class="t">${esc2(DT(prev))}</span></a>` : "<span style='flex:1'></span>")
      + (next ? `<a class="nx" href="#/docs/${encodeURI(next.id)}"><span class="l">${S().next}</span>
            <span class="t">${esc2(DT(next))}</span></a>` : "<span style='flex:1'></span>")
      + `</div>`;
    spy();
  }

  let heads = [], tocLinks = [];
  function spy(){
    heads = [...$d("dBody").querySelectorAll("h2[id],h3[id]")];
    tocLinks = [...$d("dToc").querySelectorAll("a[data-h]")];
    onScroll();
  }
  function onScroll(){
    if (!heads.length) return;
    let cur = heads[0].id;
    for (const h of heads) { if (h.getBoundingClientRect().top <= 90) cur = h.id; }
    tocLinks.forEach(a => a.classList.toggle("on", a.dataset.h === cur));
  }
  addEventListener("scroll", onScroll, { passive:true });

  function route(){
    const h = location.hash.replace(/^#\/?/, "");
    const docs = h === "docs" || h.startsWith("docs/");
    const know = h === "knowledge";
    document.body.classList.toggle("docsmode", docs);
    $d("view-dash").hidden = docs || know;
    $d("view-docs").hidden = !docs;
    $d("view-know").hidden = !know;
    const target = docs ? "docs" : know ? "know" : "dash";
    [...$d("nav").children].forEach(b =>
      b.dataset.view === target
        ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
    if (know && window.OS_KNOW_SHOW) window.OS_KNOW_SHOW();
    if (!docs) return;
    const id = h.startsWith("docs/") ? decodeURI(h.slice(5)) : "";
    sidebar(id, $d("dSearch").value);
    id ? reader(id) : index();
    if (!location.hash.includes("#", 1)) scrollTo(0, 0);
  }

  $d("nav").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    location.hash = b.dataset.view === "docs" ? "#/docs" : b.dataset.view === "know" ? "#/knowledge" : "#/";
  });
  $d("dSearch").addEventListener("input", () => {
    const h = location.hash.replace(/^#\/?/, "");
    sidebar(h.startsWith("docs/") ? decodeURI(h.slice(5)) : "", $d("dSearch").value);
  });
  addEventListener("hashchange", route);
  addEventListener("langchange", route);
  route();
})();
</script>
</body>
</html>
